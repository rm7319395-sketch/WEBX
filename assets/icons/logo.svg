<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="35%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow Circle -->
  <circle cx="80" cy="80" r="65" fill="#8B5CF6" fill-opacity="0.12" filter="url(#glow)"/>
  
  <!-- Outer Crystal Facets -->
  <polygon points="80,18 135,52 135,112 80,146 25,112 25,52" stroke="url(#neonGlow)" stroke-width="2.5" fill="none" opacity="0.6"/>
  
  <!-- Interlocking Futuristic W & X Monogram for webx -->
  <path d="M38 52 V114 L80 78 L122 114 V52" stroke="url(#purpleGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M48 114 L112 52" stroke="url(#neonGlow)" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M112 114 L48 52" stroke="url(#neonGlow)" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Central Floating Amethyst Diamond -->
  <polygon points="80,38 98,66 80,94 62,66" fill="url(#neonGlow)" fill-opacity="0.85"/>
  <polygon points="80,38 80,94 62,66" fill="#E9D5FF" fill-opacity="0.45"/>
  
  <!-- Light Sparks -->
  <circle cx="80" cy="38" r="3" fill="#FFFFFF"/>
  <circle cx="38" cy="52" r="2.5" fill="#E9D5FF"/>
  <circle cx="122" cy="52" r="2.5" fill="#E9D5FF"/>
</svg>